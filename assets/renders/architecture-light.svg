<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 412" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Anatomy of a Paired Requirement Record</title>
  <desc id="arch-desc">Declarative contract identity passes through a compatibility gate to pair B-Rep measurements across initial and revised candidates, producing a deterministic transition verdict, metric delta, and hashed provenance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #fbfcfd; stroke: #cbd5dc; stroke-width: 1.25; rx: 6; }
      .gate { fill: #edf2f4; stroke: #18272e; stroke-width: 1.4; rx: 6; }
      .prov { fill: #f4f7f8; stroke: #cbd5dc; stroke-width: 1.25; rx: 6; }
      .chip { fill: #ffffff; stroke: #d7e0e5; stroke-width: 1; rx: 4; }
      .title { font: 600 13px 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; fill: #16242b; }
      .num { font: 600 11.5px 'JetBrains Mono', ui-monospace, monospace; fill: #1f5f5b; }
      .lbl { font: 500 11.5px 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; fill: #334155; }
      .sub { font: 400 11px 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; fill: #52626b; }
      .mono { font: 500 11.5px 'JetBrains Mono', ui-monospace, monospace; fill: #16242b; }
      .mono-m { font: 400 11px 'JetBrains Mono', ui-monospace, monospace; fill: #52626b; }
      .th { font: 600 11px 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; fill: #475569; }
      .bad { font: 600 11.5px 'JetBrains Mono', ui-monospace, monospace; fill: #a93b31; }
      .good { font: 600 11.5px 'JetBrains Mono', ui-monospace, monospace; fill: #1f5f5b; }
      .neut { font: 600 11.5px 'JetBrains Mono', ui-monospace, monospace; fill: #475569; }
      .unav { font: 600 11.5px 'JetBrains Mono', ui-monospace, monospace; fill: #7c5c2b; }
      .rule { stroke: #dce4e8; stroke-width: 1; }
      .rule-strong { stroke: #18272e; stroke-width: 1.5; }
      .conn { fill: none; stroke: #475569; stroke-width: 1.35; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="412"/>

  <!-- Top header bar -->
  <text x="20" y="24" class="title" style="font-size:13.5px; letter-spacing:-0.01em;">Anatomy of a Paired Requirement Record</text>
  <text x="1060" y="24" text-anchor="end" class="mono-m">hardcad.contract.v1 · Open CASCADE B-Rep</text>
  <line x1="20" y1="34" x2="1060" y2="34" class="rule-strong"/>

  <!-- STAGE 1: Shared Check Identity -->
  <g transform="translate(20, 50)">
    <rect class="panel" width="340" height="148"/>
    <rect x="0" y="0" width="4" height="148" fill="#1f5f5b" rx="2"/>
    <text x="16" y="25" class="num">01</text>
    <text x="38" y="25" class="title">Shared Check Identity (q)</text>
    <line x1="16" y1="36" x2="324" y2="36" class="rule"/>

    <!-- Row 1 -->
    <rect class="chip" x="16" y="48" width="194" height="26"/>
    <text x="113" y="65" text-anchor="middle" class="mono">q: Requirement ID</text>
    <rect class="chip" x="218" y="48" width="106" height="26"/>
    <text x="271" y="65" text-anchor="middle" class="lbl">Operands</text>

    <!-- Row 2 -->
    <rect class="chip" x="16" y="81" width="152" height="26"/>
    <text x="92" y="98" text-anchor="middle" class="lbl">Spatial Region</text>
    <rect class="chip" x="176" y="81" width="148" height="26"/>
    <text x="250" y="98" text-anchor="middle" class="lbl">World / Local Frame</text>

    <!-- Row 3 -->
    <rect class="chip" x="16" y="114" width="70" height="24"/>
    <text x="51" y="130" text-anchor="middle" class="mono-m">Unit (mm)</text>
    <rect class="chip" x="94" y="114" width="140" height="24"/>
    <text x="164" y="130" text-anchor="middle" class="lbl">State / Path</text>
    <rect class="chip" x="242" y="114" width="82" height="24"/>
    <text x="283" y="130" text-anchor="middle" class="lbl">Bound</text>
  </g>

  <!-- Arrow 1 -> Gate -->
  <line x1="360" y1="124" x2="394" y2="124" class="conn" marker-end="url(#arrow)"/>

  <!-- COMPATIBILITY GATE -->
  <g transform="translate(396, 68)">
    <rect class="gate" width="196" height="112"/>
    <rect x="0" y="0" width="196" height="26" fill="#18272e" rx="5"/>
    <rect x="0" y="18" width="196" height="8" fill="#18272e"/>
    <text x="98" y="17" text-anchor="middle" style="font: 600 11px 'JetBrains Mono', ui-monospace, monospace; fill:#eef5f5; letter-spacing:0.04em;">COMPATIBILITY GATE</text>
    <text x="98" y="50" text-anchor="middle" class="lbl">Contract &amp; reference</text>
    <text x="98" y="69" text-anchor="middle" class="lbl">Scope &amp; checker</text>
    <line x1="22" y1="81" x2="174" y2="81" stroke="#c3d0d6" stroke-width="1"/>
    <text x="98" y="99" text-anchor="middle" class="mono" style="font-size:11px; fill:#1f5f5b;">All fields must match</text>
  </g>

  <!-- Arrow Gate -> Stage 2 -->
  <line x1="592" y1="124" x2="626" y2="124" class="conn" marker-end="url(#arrow)"/>

  <!-- STAGE 2: Recorded Revision Endpoints -->
  <g transform="translate(628, 50)">
    <rect class="panel" width="432" height="148"/>
    <rect x="0" y="0" width="4" height="148" fill="#365973" rx="2"/>
    <text x="16" y="25" class="num" style="fill:#365973;">02</text>
    <text x="38" y="25" class="title">Recorded B-Rep Revision Endpoints</text>
    <line x1="16" y1="36" x2="416" y2="36" class="rule"/>

    <!-- Mini Booktabs header -->
    <text x="16" y="57" class="th">Recorded Field</text>
    <text x="242" y="57" text-anchor="middle" class="th">Initial (0)</text>
    <text x="358" y="57" text-anchor="middle" class="th">Revised (1)</text>
    <line x1="16" y1="65" x2="416" y2="65" stroke="#64748b" stroke-width="1"/>

    <!-- Rows -->
    <text x="16" y="86" class="lbl">Metric value (<tspan class="mono">vᵢ</tspan>)</text>
    <text x="242" y="86" text-anchor="middle" class="mono">v₀  <tspan class="mono-m">or null</tspan></text>
    <text x="358" y="86" text-anchor="middle" class="mono">v₁  <tspan class="mono-m">or null</tspan></text>
    <line x1="16" y1="95" x2="416" y2="95" class="rule"/>

    <text x="16" y="113" class="lbl">Check status (<tspan class="mono">sᵢ</tspan>)</text>
    <text x="242" y="113" text-anchor="middle" class="mono">s₀</text>
    <text x="358" y="113" text-anchor="middle" class="mono">s₁</text>
    <line x1="16" y1="122" x2="416" y2="122" class="rule"/>

    <text x="16" y="139" class="lbl">Availability reason (<tspan class="mono">rᵢ</tspan>)</text>
    <text x="242" y="139" text-anchor="middle" class="mono">r₀  <tspan class="mono-m">or null</tspan></text>
    <text x="358" y="139" text-anchor="middle" class="mono">r₁  <tspan class="mono-m">or null</tspan></text>
  </g>

  <!-- Orthogonal connector Stage 2 -> Stage 3 -->
  <path d="M 844 198 L 844 214 L 340 214 L 340 227" class="conn" marker-end="url(#arrow)"/>

  <!-- STAGE 3: Transition Verdict & Metric Delta -->
  <g transform="translate(20, 230)">
    <rect class="panel" width="640" height="168"/>
    <rect x="0" y="0" width="4" height="168" fill="#18272e" rx="2"/>
    <text x="16" y="25" class="num" style="fill:#18272e;">03</text>
    <text x="38" y="25" class="title">Transition Verdict &amp; Metric Delta</text>
    <text x="622" y="25" text-anchor="end" class="mono-m">s₀ → s₁</text>
    <line x1="16" y1="36" x2="624" y2="36" class="rule"/>

    <!-- Column headers -->
    <text x="16" y="54" class="th">Status transition (s₀ → s₁)</text>
    <text x="320" y="54" class="th">Paired verdict</text>
    <text x="530" y="54" class="th">Metric delta (Δv)</text>
    <line x1="16" y1="61" x2="624" y2="61" stroke="#64748b" stroke-width="1"/>

    <!-- Row 1: Regression -->
    <rect x="16" y="64" width="608" height="20" fill="#fdf2f0"/>
    <text x="22" y="78" class="lbl">Meets → violates</text>
    <circle cx="324" cy="74" r="3" fill="#b83b30"/>
    <text x="334" y="78" class="bad">REGRESSION</text>
    <text x="530" y="78" class="mono">v₁ − v₀</text>

    <!-- Row 2: Repair -->
    <rect x="16" y="86" width="608" height="20" fill="#eef7f4"/>
    <text x="22" y="100" class="lbl">Violates → meets</text>
    <circle cx="324" cy="96" r="3" fill="#1f7a64"/>
    <text x="334" y="100" class="good">REPAIR</text>
    <text x="530" y="100" class="mono">v₁ − v₀</text>

    <!-- Row 3: Unchanged -->
    <text x="22" y="121" class="lbl">Same measured verdict</text>
    <circle cx="324" cy="117" r="3" fill="#64748b"/>
    <text x="334" y="121" class="neut">UNCHANGED</text>
    <text x="530" y="121" class="mono">v₁ − v₀</text>
    <line x1="16" y1="127" x2="624" y2="127" class="rule"/>

    <!-- Row 4: Unavailable -->
    <text x="22" y="143" class="lbl">Either endpoint unmeasured</text>
    <circle cx="324" cy="139" r="3" fill="#9a7235"/>
    <text x="334" y="143" class="unav">UNAVAILABLE</text>
    <text x="530" y="143" class="mono-m">null  (null ≠ 0)</text>

    <!-- Semantics note bar -->
    <rect x="16" y="151" width="608" height="1" fill="#dce4e8"/>
    <text x="16" y="163" class="mono-m" style="font-size:10.5px;">Δv = v₁ − v₀ iff both endpoints are measured · Always retain unavailable status + reason</text>
  </g>

  <!-- Arrow Stage 3 -> Linked Provenance -->
  <line x1="660" y1="314" x2="696" y2="314" class="conn" marker-end="url(#arrow)"/>

  <!-- STAGE 4: Linked Provenance -->
  <g transform="translate(698, 230)">
    <rect class="prov" width="362" height="168"/>
    <rect x="0" y="0" width="362" height="3.5" fill="#18272e" rx="1"/>
    <text x="18" y="27" class="num" style="fill:#18272e;">04</text>
    <text x="40" y="27" class="title">Linked Provenance &amp; Replay</text>
    <line x1="18" y1="38" x2="344" y2="38" class="rule"/>

    <text x="18" y="61" class="th">Global material deltas</text>
    <text x="18" y="79" class="mono">ΔIoU ,  ΔE_V (extra) ,  ΔM_V (missing)</text>
    <line x1="18" y1="91" x2="344" y2="91" class="rule"/>

    <text x="18" y="111" class="th">Cryptographic binding</text>
    <text x="18" y="128" class="mono-m">SHA-256: input · contract · checker</text>
    <line x1="18" y1="139" x2="344" y2="139" class="rule"/>

    <text x="18" y="157" class="sub">Binds local transitions to global deltas for deterministic replay.</text>
  </g>
</svg>
